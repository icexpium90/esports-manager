# Reverse proxy Apache : manager.luostatis.fr -> eSports Manager sur le port 1212
# À copier dans /etc/apache2/sites-available/manager.luostatis.fr.conf
# Modules requis : sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite
<VirtualHost *:80>
    ServerName manager.luostatis.fr

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"

    # WebSockets (rechargement en direct éventuel)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:1212/$1 [P,L]

    ProxyPass        / http://127.0.0.1:1212/
    ProxyPassReverse / http://127.0.0.1:1212/

    ErrorLog ${APACHE_LOG_DIR}/manager.luostatis.fr-error.log
    CustomLog ${APACHE_LOG_DIR}/manager.luostatis.fr-access.log combined
</VirtualHost>
