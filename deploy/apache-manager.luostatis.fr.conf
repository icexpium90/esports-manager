# Reverse proxy Apache : manager.luostatis.fr -> application sur le port 1212
# Modules requis : sudo a2enmod proxy proxy_http headers
<VirtualHost *:80>
    ServerName manager.luostatis.fr
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    ProxyPass        / http://127.0.0.1:1212/
    ProxyPassReverse / http://127.0.0.1:1212/
</VirtualHost>
